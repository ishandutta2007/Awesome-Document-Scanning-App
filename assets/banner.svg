<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Scanner Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspects */
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(180px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.2; }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.1); }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-25px, 25px) scale(0.95); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    .animated-scan {
      animation: scanLine 5s ease-in-out infinite;
    }
    .particle-1 {
      animation: floatParticle1 8s ease-in-out infinite;
    }
    .particle-2 {
      animation: floatParticle2 10s ease-in-out infinite;
    }
    .pulsing-grid {
      animation: pulseGlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs / Particles (Behind Content) -->
  <g class="particle-1">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  </g>
  <g class="particle-2">
    <circle cx="1000" cy="300" r="160" fill="#c084fc" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Decorative Tech Grid (Background Layer) -->
  <g class="pulsing-grid" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />

    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Decorative Document Scanner Animation Graphic (Right Side Background Element) -->
  <g transform="translate(860, 90)">
    <!-- Document Container Frame -->
    <rect x="0" y="0" width="220" height="240" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Simulated Document Content Lines -->
    <rect x="30" y="35" width="160" height="12" rx="4" fill="#ffffff" opacity="0.4" />
    <rect x="30" y="60" width="120" height="8" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="30" y="80" width="140" height="8" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="30" y="100" width="100" height="8" rx="3" fill="#ffffff" opacity="0.25" />
    
    <!-- Document Corner Marks -->
    <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path d="M 200 40 L 200 20 L 180 20" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path d="M 20 200 L 20 220 L 40 220" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path d="M 200 200 L 200 220 L 180 220" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Animated Scan Light Beam -->
    <g class="animated-scan">
      <rect x="10" y="30" width="200" height="6" fill="url(#scanBeam)" filter="url(#glow)" />
      <line x1="10" y1="33" x2="210" y2="33" stroke="#e0f2fe" stroke-width="2" />
    </g>
  </g>

  <!-- FOREGROUND TEXT CONTENT -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="115" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">📱 MOBILE &amp; OCR DIGITIZATION</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="175" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Awesome Document Scanning Apps</text>

  <!-- Subtitle -->
  <text x="80" y="225" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Curated SaaS Platforms &amp; Open-Source Mobile OCR Scanning Solutions</text>

  <!-- Feature Pills Footer -->
  <g transform="translate(80, 280)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="32" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="82" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">✨ Edge Detection</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="165" height="32" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="82" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Privacy-First OCR</text>
    </g>
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="175" height="32" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
      <text x="87" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📄 Searchable PDF Export</text>
    </g>
  </g>
</svg>
